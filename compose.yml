# Self-hosters:  docker compose up -d        (pulls ghcr.io/ddovidenko/astrocaption:latest once released)
# From a clone:  docker compose up -d --build   (or `make up`)
services:
  app:
    image: ghcr.io/ddovidenko/astrocaption:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8000"
    volumes:
      - ./data:/data
    environment:
      - TRUST_PROXY=0
      - NOVA_API_KEY=${NOVA_API_KEY:-${ASTROMETRY_API_KEY:-}}
      # headless first run (optional); read once, see docs/INSTALL.md
      - ASTROCAPTION_PASSWORD=${ASTROCAPTION_PASSWORD:-}
      # solve queue timings, in seconds; read once at start, see docs/INSTALL.md
      # - ASTROCAPTION_SOLVE_TIMEOUT_SECONDS=900
      # - ASTROCAPTION_SOLVE_POLL_SECONDS=5
    restart: unless-stopped
