[project]
name = "astrocaption"
version = "0.1.0"
description = "Plate-solve a finished astrophoto and build legible annotations on top of it."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["catalog/*.json", "catalog/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "static"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "scripts"]
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app"]
