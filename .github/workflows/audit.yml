# Weekly `make audit`: pip-audit over the pinned backend requirements and npm audit over the
# frontend lockfile. A failed run is the loud signal #250 asked for (GitHub mails the owner),
# independent of whether Dependabot happens to open a PR that week. Run it by hand from the
# Actions tab before cutting a release.
name: audit

on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC, after Dependabot's weekly pass
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make audit
