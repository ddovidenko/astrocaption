name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: cd backend && ruff check . && ruff format --check . && mypy
      - run: cd backend && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: astrocaption:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image size must stay under 400 MB
        run: |
          size=$(docker image inspect astrocaption:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((400 * 1024 * 1024))
      - name: smoke test
        run: |
          docker run -d --rm --name ac -p 8000:8000 astrocaption:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          docker stop ac
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: install Chromium for Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: browser smoke test against the image
        run: |
          docker run -d --rm --name ac-e2e -p 8000:8000 \
            --add-host=host.docker.internal:host-gateway \
            -e NOVA_BASE_URL=http://host.docker.internal:8901 -e NOVA_API_KEY=fixture \
            astrocaption:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          cd frontend && FAKE_NOVA_HOST=0.0.0.0 E2E_BASE_URL=http://127.0.0.1:8000 CI=1 npx playwright test
      - name: stop the image
        if: always()
        run: docker logs ac-e2e || true; docker stop ac-e2e || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
