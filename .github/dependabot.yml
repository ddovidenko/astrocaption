# Dependabot opens PRs for dependency updates. Minor and patch bumps are grouped per
# ecosystem so a week's updates arrive as one PR; majors stay separate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS compiler API yet, so typescript-eslint pins
      # typescript <6.1.0 and the whole npm job aborts on the 7.x bump.
      # Remove when #27 (TypeScript 7 upgrade) lands.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
