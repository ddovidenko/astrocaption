# Dependabot opens PRs for dependency updates. Minor and patch bumps are grouped per
# ecosystem so a week's updates arrive as one PR; majors stay separate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS compiler API yet, so typescript-eslint pins
      # typescript <6.1.0 and the whole npm job aborts on the 7.x bump.
      # Remove when #27 (TypeScript 7 upgrade) lands.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node the project runs (26, the Docker build stage, CI and the
      # devcontainer); a newer major's types would accept APIs that runtime lacks. Bump it by
      # hand together with the Node LTS move below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The build stage tracks Node LTS by hand (odd majors never become LTS; even
      # majors only after their LTS date). Minor/patch alpine bumps still flow.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
